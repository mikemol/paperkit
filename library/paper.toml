[paper]
adequacy = true
title = "The Paperkit Concept Library"
subtitle = "Each concept's witness is authored and GRADED here once; every view imports the certificate (verdict + engine fingerprint) rather than re-authoring a parallel proof."
warrants = ["concepts.bib"]
rubric = "rubric.tsv"
out = "library.md"
numbered = false
references = false

# ⚑ Ζ·entry·point — THE BIB NAMES AN ENTRY POINT, NOT AN INTERPRETER.  This read `python3
# concepts.py {target}`: a bare `python3` with no virtualenv, so the witness had to reach the
# engine itself via three `sys.path.insert` lines.  `run-witness` owns the environment (the venv,
# and building it if absent); `concepts.py` owns the logic; this declaration names only the
# entry point.  What the script does is its own business — see its header.
#
# ⚑⚑ MEASURED: with `paperkit/bib.py` on the PACKAGE spelling, `python3 concepts.py
# claim-is-record` dies `ModuleNotFoundError: No module named 'paperkit'` while `./run-witness
# claim-is-record` reports OK.  Same witness, same engine, same target — the entry point is the
# whole delta, and it is what lets an engine module adopt `from paperkit import x` at all.
#
# ⚑⚑⚑ `witness` IS SEPARATE FROM `cmd`, AND REQUIRED.  `cmd` is the INVOCATION (opaque — the
# engine runs it and reads nothing out of it); `witness` is the MODULE, which the cell grid, the
# top-level audit and the closure census each need.  One string cannot be both: the module used to
# be inferred by taking the first `.py` token out of `cmd`, which worked only while the command
# happened to name a python file.  This entry point does not.
[checks.claim]
cmd = "./run-witness {target}"
witness = "concepts.py"

# Ζ·library·grid — the per-claim WITNESS type, declared so the def-sweep runs as a CELL GRID
# rather than 42 monolithic sweeps.  The grid gate needs a per-claim closure; _closures() finds
# the witness module from the declaration ABOVE, and with none declared the library paid ~10
# minutes per claim, a critical path nothing could parallelise, all-or-nothing cache
# invalidation, per-claim rather than per-site failures, and no def memory measurement at all.
#
# Downstream concept: imports are unaffected — the resolver runs the witness directly and never
# reads this bib's check field.
#
# The declaration sits ABOVE this prose deliberately.  _claim_script scans forward from the
# section header for the first three-letter command key and takes the first .py token on that
# line, so ANY prose above it that happens to contain either token shadows the assignment and
# yields an empty closure.  Measured twice while writing this comment.
