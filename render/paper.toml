[paper]
title = "Paperkit — Rendering: paper.md → docx, Gated to Agree"
subtitle = "Gated every commit: the paper renders to a Word document, and the document is gated to PRESENT the verified paper faithfully — presentation agreement extends prose≡projection down the render stack, with the toolchain-coupled checks gated but not mutation-swept (Ζ·tier)."
warrants = ["warrants.bib"]
rubric = "rubric.tsv"
out = "RENDER.md"

# Γ·delta·root — the Δ sandbox root, declared because the engine is a sibling and
# layout._sandbox_root refuses to infer.  The bound is the REPO (render's sandbox-tier compliance
# witnesses read the engine's projector and the WCAG model).  See paper/paper.toml.
root = ".."
numbered = false
references = false
# Ζ·tier — render's PURE compliance warrants (wcag_model/matrix/cube/use-of-colour/format)
# are sandbox-gated and MUTATION-SWEPT (the standards model + capability coalgebra enforced every
# commit); its toolchain warrants are cached+stamped, gated but not swept.  adequacy grades the
# sandbox subset.
adequacy = true
