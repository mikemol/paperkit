   <path d="M0 0 10 5 0 10z" fill="#111"/></marker></defs>
 <g font-family="sans-serif" font-size="12" fill="#111">
  <rect x="150" y="20" width="160" height="52" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="230" y="40" text-anchor="middle" font-weight="bold">library</text>
  <text x="230" y="58" text-anchor="middle" font-size="11">one graded witness</text>
  <g fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a2)">
