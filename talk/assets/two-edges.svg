<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210"
     role="img" aria-label="Two edge types over the same claims: a solid prose-order chain, and a dashed grounding DAG">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#333"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="12">
    <text x="8" y="16" font-size="11">from: prose order (solid)</text>
    <text x="8" y="202" font-size="11">rests-on: grounding (dashed)</text>
    <g fill="#fff" stroke="#333">
      <rect x="20" y="34" width="90" height="30" rx="4"/>
      <rect x="165" y="34" width="90" height="30" rx="4"/>
      <rect x="310" y="34" width="90" height="30" rx="4"/>
      <rect x="20" y="140" width="90" height="30" rx="4"/>
      <rect x="165" y="140" width="90" height="30" rx="4"/>
      <rect x="310" y="140" width="90" height="30" rx="4"/>
    </g>
    <g fill="#111" text-anchor="middle">
      <text x="65" y="53">claim A</text><text x="210" y="53">claim B</text><text x="355" y="53">claim C</text>
      <text x="65" y="159">check</text><text x="210" y="159">check</text><text x="355" y="159">check</text>
    </g>
    <g fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ar)">
      <path d="M110 49 H160"/><path d="M255 49 H305"/>
    </g>
    <g fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)">
      <path d="M65 138 V70"/><path d="M210 138 V70"/><path d="M355 138 L216 70"/>
    </g>
  </g>
</svg>
